

<div class="container py-4">
   <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 550px;">
      <div class="card-header text-white text-center rounded-top-4" style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
         <h2 class="mb-0 fw-bold"><i class="bi bi-key me-2"></i>{{ 'Auth.ResetPassword' | translate }}</h2>
      </div>
      <div class="card-body p-4">
         <div class="alert alert-success d-flex align-items-center" role="alert" *ngIf="!form.error && form.message">
            <i class="bi bi-check-circle me-2"></i>
            <div>{{ form.message }}</div>
         </div>
         <div class="alert alert-danger d-flex align-items-center" role="alert" *ngIf="form.error && form.message">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <div>{{ form.message }}</div>
         </div>
         <div class="mb-4">
            <label class="form-label fw-bold">{{ 'Common.LoginId' | translate }} <span class="text-danger">*</span></label>
            <input type="text" name="loginId" class="form-control" [(ngModel)]="form.data.loginId" [placeholder]="'Auth.EnterLoginId' | translate">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.loginId">
               <i class="bi bi-exclamation-circle me-1"></i>{{ form.inputerror.loginId }}
            </div>
         </div>
         <div class="text-center">
            <button type="button" class="btn btn-primary px-4" (click)="submit()">
               <i class="bi bi-arrow-right me-2"></i>{{ 'Buttons.Continue' | translate }}
            </button>
         </div>
         <div class="text-center mt-3">
            <p class="mb-0 text-muted small">
               <a href="/login" class="text-decoration-none">{{ 'Auth.BackToLogin' | translate }}</a>
            </p>
         </div>
      </div>
   </div>
</div>

<app-footer></app-footer>
