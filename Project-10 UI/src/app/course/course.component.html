<div class="container py-4">
   <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
      <div class="card-header text-white text-center rounded-top-4" style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
         <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-journal-plus me-2"></i>{{ 'Forms.Add' | translate:{entity: ('Common.Course' | translate)} }}</h2>
         <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>{{ 'Forms.Update' | translate:{entity: ('Common.Course' | translate)} }}</h2>
      </div>
      <div class="card-body p-4">
         <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
         <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>
         <div class="mb-3"><label class="form-label fw-bold">{{ 'Common.Name' | translate }} <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" [(ngModel)]="form.data.name" [placeholder]="'Placeholders.EnterCourseName' | translate"><div class="text-danger small mt-1" *ngIf="form.inputerror.name">{{ form.inputerror.name }}</div></div>
         <div class="mb-3"><label class="form-label fw-bold">{{ 'Common.Duration' | translate }} <span class="text-danger">*</span></label><select name="duration" class="form-select" [(ngModel)]="form.data.duration"><option [ngValue]="undefined">{{ 'Options.Select' | translate }}</option><option [ngValue]="1">{{ 'Options.OneYear' | translate }}</option><option [ngValue]="2">{{ 'Options.TwoYear' | translate }}</option><option [ngValue]="3">{{ 'Options.ThreeYear' | translate }}</option><option [ngValue]="4">{{ 'Options.FourYear' | translate }}</option><option [ngValue]="5">{{ 'Options.FiveYear' | translate }}</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.duration">{{ form.inputerror.duration }}</div></div>
         <div class="mb-4"><label class="form-label fw-bold">{{ 'Common.Description' | translate }} <span class="text-danger">*</span></label><textarea name="description" class="form-control" [(ngModel)]="form.data.description" rows="4" [placeholder]="'Placeholders.EnterDescription' | translate" style="resize: none;"></textarea><div class="text-danger small mt-1" *ngIf="form.inputerror.description">{{ form.inputerror.description }}</div></div>
         <div class="text-center"><button type="button" class="btn btn-primary px-4" (click)="submit()"><i class="bi bi-save me-2"></i>{{ 'Buttons.Save' | translate }}</button></div>
      </div>
   </div>
</div>
<app-footer></app-footer>
