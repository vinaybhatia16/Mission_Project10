<div align="center">
    <h1 align="center" style="margin-bottom: 5px; color: navy;">Role List</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <div *ngIf="form.list.length > 0">
        <div class="d-flex flex-wrap align-items-center justify-content-center gap-3 mb-4">
            <div class="d-flex align-items-center gap-2">
                <label for="roleName" class="form-label fw-bold mb-0">Name</label>
                <input id="roleName" type="text" name="name" class="form-control"
                    style="width: 320px;"
                    [(ngModel)]="form.searchParams.name" placeholder="Enter Role Name">
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" (click)="search()">Search</button>
                <button type="button" class="btn btn-outline-secondary" (click)="reset()">Reset</button>
            </div>
        </div>

        <br>

        <table border="1" style="width: 100%; border: groove;">
            <tr style="background-color: #e1e6f1e3;">
                <th><input type="checkbox" [(ngModel)]="isMasterSel" (change)="checkUncheckAll($event)" /></th>
                <th>S.No</th>
                <th>Name</th>
                <th>Description</th>
                <th>Edit</th>
            </tr>

            <tr align="center" *ngFor="let m of form.list; let i = index">
                <td><input type="checkbox" #checkboxes (change)="checklistUpdate()" [id]="m.id" [value]="isMasterSel"></td>
                <td>{{(form.pageNo*5)+i+ 1}}</td>
                <td>{{m.name}}</td>
                <td>{{m.description}}</td>
                <td><a (click)="forward('/role/' + m.id)" style="cursor: pointer;">Edit</a></td>
            </tr>
        </table>

        <br>

        <table style="width: 100%">
            <tr>
                <td style="width: 25%"><button (click)="previous()" [disabled]="form.pageNo == 0">previous</button></td>
                <td align="center" style="width: 25%"><button (click)="forward('/role')">new</button></td>
                <td align="center" style="width: 25%"><button (click)="deleteMany()">delete</button></td>
                <td style="width: 25%" align="right"><button (click)="next()" [disabled]="form.nextListSize == 0">next</button></td>
            </tr>
        </table>
    </div>

    <br>

    <div *ngIf="form.list.length == 0"><button (click)="reset()">Back</button></div>
</div>

<app-footer></app-footer>
